const state={screen:'product',tab:'details',menu:null,modal:null,filter:'All',mobile:false,search:'',fav:false,stack:[]};
const toneIcon=(name,tone='green')=>`<span class="icon-tile tone-${tone}">${ico(name)}</span>`;
const navto=(id,tab='details')=>{if(!records[id])return;state.menu=null;state.modal=null;state.screen=id;state.tab=tab;state.search='';const url=new URL(location.href);url.searchParams.set('screen',id);url.searchParams.set('tab',tab);history.pushState({id,tab},'',url);render();window.scrollTo(0,0)};
const goto=(id,tab)=>`data-go="${esc(id)}"${tab?` data-tab="${tab}"`:''}`;

function demobar(){document.querySelector('#demobar').innerHTML=`<div><strong>Interactive design prototype</strong> <span>· Fictional data · Nothing is saved</span></div><div class="demo-controls"><button class="smallbtn" data-action="Browse wireframes">${ico('grid')} All screens</button><button class="smallbtn ${state.mobile?'selected':''}" id="mobileToggle">${ico('device')} ${state.mobile?'Desktop view':'Phone preview'}</button></div>`}
const actionsFor=r=>{if(r.actions)return r.actions;return ['Open','Edit']};
function actions(id,compact=false){const r=records[id],act=actionsFor(r),a=act[0],b=act[1];return `<div class="split-actions">${splitAction('usage',a,id,true)}${splitAction('manage',b,id,false)}</div>`}
function splitAction(group,label,id,primary){const opts=group==='usage'? usageOptions(id,label):manageOptions(id,label);return `<div class="action-pair ${primary?'primary':''}"><button type="button" class="action-main" data-action="${esc(label)}">${ico(primary?'cart':'edit')}${esc(label)}</button><button type="button" class="action-drop" aria-label="More ${group} actions" aria-expanded="${state.menu===group}" data-menu="${group}">${ico('down',16)}</button>${state.menu===group?`<div class="dropdown" role="menu">${opts.map(([name,icon])=>`<button role="menuitem" data-action="${esc(name)}">${ico(icon)}${esc(name)}</button>`).join('')}</div>`:''}</div>`}
function usageOptions(id,main){const base= id==='product'?[['Add to shopping list','cart'],['Adjust stock','box'],['Record purchase','receipt'],['Create task','task']]:[[main,'check'],['Open linked records','link'],['Create task','task']];return base}
function manageOptions(id,main){return id==='product'?[['Edit product','edit'],['Link alternative','swap'],['Stock settings','layers'],['Archive product','notes']]:[[main,'edit'],['Link related record','link'],['Archive record','notes']]}
function stats(id){const s=id==='product'?[['3 bottles','In stock','box','green','stock'],['1','Shopping','cart','orange','shopping'],['4','Recipes','recipe','purple','recipe'],['12','Purchases','receipt','blue','purchases']]:id==='money'?[['€2,398','Actual balance','bank','green','account'],['€2,298','Forecast','trend','blue','account'],['14','Recurring','repeat','purple','recurring'],['4','Expenses','wallet','orange','expenses']]:id==='expenses'?[['4','Upcoming','calendar','orange','expense'],['14','Recurring','repeat','purple','recurring'],['21','Paid','check','green','expense'],['2','Accounts','bank','blue','account']]:[[records[id].values[0][1],records[id].values[0][0],records[id].icon,records[id].tone,id],['1','Shopping','cart','orange','shopping'],['3','Tasks','task','purple','task'],['2','Links','link','blue','product']];return `<div class="stats">${s.map(([v,l,ic,t,to])=>`<button class="stat" ${goto(to)}>${toneIcon(ic,t)}<span><strong>${esc(v)}</strong><small>${esc(l)}</small></span></button>`).join('')}</div>`}

function productHero(){const id='product';return `<section class="hero">${milkPhoto()}<div class="hero-content"><div class="hero-top"><div><h1>Boni Halfvolle Melk 1L</h1><div class="chips"><span class="chip green">${ico('check')}In stock</span><span class="chip orange">${ico('star')}Essential</span><span class="chip" ${goto('shop')}>${ico('cart')}Colruyt</span><span class="chip">Dairy</span></div><p class="summary-description">${esc(records.product.subtitle)}</p></div><div class="desktop-actions">${actions(id)}</div></div>${stats(id)}<div class="mobile-actions">${actions(id)}</div></div></section>`}

function quickInfo(id){const r=records[id];const rows=id==='product'?[['Barcode','5410141234567','barcode','blue'],['Pack size','1 liter (1 L)','box','teal'],['Brand','Boni','tag','purple'],['Shop','Colruyt','store','orange']]:r.values.slice(0,4).map(([a,b],i)=>[a,b,['info','box','tag','store'][i],['blue','green','purple','orange'][i]]);return `<section class="panel"><div class="panel-heading"><div class="panel-title">${toneIcon('info','blue')}Product info</div></div><div class="quick-row">${rows.map(([a,b,ic,t])=>`<div class="quick-item">${toneIcon(ic,t)}<span><small>${esc(a)}</small><strong>${esc(b)}</strong></span></div>`).join('')}</div></section>`}
function detailView(id){const r=records[id];let rows=id==='product'?r.values.slice(4):r.values;return `${quickInfo(id)}<section class="panel"><div class="panel-heading"><div class="panel-title">${toneIcon('list','purple')}${id==='product'?'Product details':`${esc(r.label)} details`}</div><button class="subtle-button" data-action="${esc(r.actions?.[1]||'Edit')}">${ico('edit')} Edit</button></div><table class="detail-table">${rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}${(k==='Product'||k==='Related purchase')?` <button class="smallbtn" ${goto(k==='Product'?'product':'purchase')}>Open</button>`:''}</td></tr>`).join('')}</table></section><section class="panel"><div class="panel-heading"><div class="panel-title">${toneIcon('notes','orange')}Notes</div></div><div class="notes">${esc(r.note)}</div></section>`}
function linkRows(id){if(id==='product')return {recipe:[['Pancakes','Uses 250 ml · Breakfast','🥞','recipe'],['Crepes','Family favourite','🧁','recipe'],['Milkshake','Uses milk','🥛','recipe']],shopping:[['On the shopping list','2 bottles · Colruyt','🛒','shopping']],purchases:[['Last purchase · 16 Oct 2026','4 bottles · €3.96','🧾','purchase']],alternatives:[['Boni Volle Melk 1L','Whole milk','🥛','alternatives'],['Lactose-free milk 1L','Alternative','🥤','alternatives']]};if(id==='expenses')return {recurring:[['Home internet','€49.99 monthly · Next 19 Nov','🔁','recurring']],expense:[['Colruyt','Paid · €3.96 · 16 Oct','🧾','expense']]};if(id==='money')return {account:[['Joint current account','Actual €2,398 · Forecast €2,298','🏦','account']],recurring:[['Home internet','Next €49.99 · 19 Nov','🔁','recurring']]};return {}}

in separate source-aware flows; no invented readings.</p></section>`;if(id==='shopping')return `<section class="panel"><div class="panel-heading"><div class="panel-title">${toneIcon('cart','orange')}Today's list</div><button class="subtle-button" data-action="Start shopping">Start trip</button></div>${[['Boni Halfvolle Melk','2 bottles · Colruyt','product'],['Eggs','6 pieces · Colruyt','recipe'],['Bread','1 loaf · Colruyt','shop'],['Pasta','500 g · Colruyt','recipe']].map(([t,s,to])=>`<div class="record-row"><input type="checkbox" class="check-item" aria-label="Mark ${esc(t)} bought" style="width:18px;height:18px;accent-color:#0b8048"/><span class="record-text"><strong>${t}</strong><small>${s}</small></span><button class="smallbtn" ${goto(to)}>Open</button></div>`).join('')}</section>`;if(id==='recurring')return `<section class="panel"><h2>Upcoming occurrences</h2>${[['19 Nov 2026','€49.99 · Expected'],['19 Dec 2026','€49.99 · Expected'],['19 Jan 2027','€49.99 · Expected']].map(([d,v])=>`<div class="money-row"><span><strong>${d}</strong><small>${v}</small></span><button class="subtle-button" data-action="Edit occurrence">Edit this payment</button></div>`).join('')}<p class="fineprint">Editing an occurrence does not change all future payments. Pause/resume preserves paid history.</p></section>`;if(id==='account')return `<section class="panel"><h2>Linked account entries</h2>${row('Household contribution','+€1,500 · Recorded','💰','income')}${row('Colruyt expense','−€3.96 · Paid','🧾','expense')}${row('Monthly internet','€49.99 expected · Not yet paid','🔁','recurring')}</section>`;return ''}
function bodyView(){const id=state.screen;return `${id==='product'?productHero():titleHead(id)}${navtabs()}${state.tab==='details'?detailView(id):`${extraView(id)}${overviewView(id)}`}`}
function bottomnav(){const links=[['dashboard','Today','home'],['task','Tasks','task'],['shopping','Shopping','cart'],['home','Home','house'],['product','More','grid']];document.querySelector('#bottomnav').innerHTML=links.map(([id,label,icon])=>`<button ${goto(id)} class="${state.screen===id?'active':''}">${ico(icon)}${label}</button>`).join('')}
function render(){sidebar();topbar();demobar();document.querySelector('#screen').innerHTML=bodyView();bottomnav();document.querySelector('#mobileToggle')?.addEventListener('click',()=>{state.mobile=!state.mobile;document.body.classList.toggle('sim-phone',state.mobile);render()});document.querySelector('#navsearch')?.addEventListener('input',e=>{const query=e.target.value.trim().toLowerCase();const matches=Object.entries(records).filter(([id,v])=>id.includes(query)||v.title.toLowerCase().includes(query)||v.label.toLowerCase().includes(query)).slice(0,16);document.querySelector('#navresult').innerHTML=query?matches.map(([id,v])=>`<button class="navlink" ${goto(id)}>${ico(v.icon)}${esc(v.title)}</button>`).join('')||'<small>No matching wireframes</small>':(sidebar(),null)});}
function closeMenu(){state.menu=null;render()}
function openModal(action){state.menu=null;state.modal=action;const list=action==='Browse wireframes';const contents=list?`<p>Select any workspace and follow its relationships.</p><div class="screen-tiles">${Object.entries(records).map(([id,r])=>`<button class="screen-tile" ${goto(id)}>${toneIcon(r.icon,r.tone)}${esc(r.label)}</button>`).join('')}</div>`:action==='View product image'?`<div class="product-visual" style="max-height:350px">${milkPhoto()}</div><p class="fineprint">Illustrative product packshot for this design prototype.</p>`:`<p>This opens the <strong>${esc(action)}</strong> workflow in the real app. In this prototype, the layout and navigation are interactive but <strong>no data is saved</strong>.</p><div class="fields"><label>Example quantity or value<input value="${action.toLowerCase().includes('stock')?'3 bottles':action.toLowerCase().includes('shopping')?'2 bottles':''}" aria-label="Example value"/></label><label>Notes (optional)<input placeholder="Add a household note"/></label></div>`;document.querySelector('#overlays').innerHTML=`<div class="modal-layer"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(action)}"><h2>${toneIcon(list?'grid':'info',list?'green':'blue')}${esc(action)}</h2>${contents}<footer><button data-close="1">Close</button>${list?'':`<button class="confirm" data-demo-save="1">Try action</button>`}</footer></div></div>`}
let toastTimer;function toast(msg){clearTimeout(toastTimer);document.querySelector('#overlays').innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;toastTimer=setTimeout(()=>document.querySelector('#overlays').innerHTML='',2600)}
document.addEventListener('click',e=>{let target=e.target.closest('button,a');if(!target){if(state.menu){state.menu=null;render()}return}if(target.matches('[data-go]')){e.preventDefault();navto(target.dataset.go,target.dataset.tab||'details');return}if(target.matches('[data-active-tab]')){state.tab=target.dataset.activeTab;const u=new URL(location.href);u.searchParams.set('tab',state.tab);history.replaceState({id:state.screen,tab:state.tab},'',u);render();return}if(target.matches('[data-menu]')){state.menu=state.menu===target.dataset.menu?null:target.dataset.menu;render();return}if(target.matches('[data-action]')){openModal(target.dataset.action);return}if(target.matches('[data-close]')){document.querySelector('#overlays').innerHTML='';return}if(target.matches('[data-demo-save]')){toast('Demo interaction only — no household data changed.');return}if(target.id==='backBtn'){history.back();return}if(target.id==='fav'){state.fav=!state.fav;target.style.color=state.fav?'#c32653':'#2f4858';toast(state.fav?'Added to favourites (demo)':'Removed from favourites (demo)');return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelector('#overlays').innerHTML='';if(state.menu){state.menu=null;render()}}});
window.addEventListener('popstate',()=>{const u=new URL(location.href);state.screen=records[u.searchParams.get('screen')]?u.searchParams.get('screen'):'product';state.tab=u.searchParams.get('tab')==='overview'?'overview':'details';state.menu=null;render()});

function whDemoCollection(id,heading='Records',sub='Open an example to inspect its workspace.'){
 const rows=records[id].items||[];

function whChipRow(choices,key='filter'){

}

 if(scene==='assistant-chat')return whCard('Conversation',`<div class="wh-chat"><p class="wh-bubble user">What do we still need at Colruyt?</p><p class="wh-bubble">You have 5 items on the shopping list. Milk is linked to your weekly groceries. <button class="smallbtn" ${goto('shopping')}>Open shopping</button></p>${whState.search?`<p class="wh-bubble user">${esc(whState.search)}</p><p class="wh-bubble">This is a demo conversation. Real changes require authorised tools.</p>`:''}</div><div class="wh-chat-form"><input id="whAsk" placeholder="Ask about household records…" aria-label="Message"/><button class="wh-primary" data-wh-ask="1">Send</button></div>`,'list','teal');

function titleHead(id){

 if(id==='product')return `<div class="stats">${[['3 bottles','In stock','box','green','stock'],['1','Shopping','cart','orange','shopping'],['4','Recipes','recipe','purple','recipe'],['12','Purchases','receipt','blue','purchases']].map(([v,l,ic,t,to])=>`<button class="stat" ${goto(to)}>${toneIcon(ic,t)}<span><strong>${esc(v)}</strong><small>${esc(l)}</small></span></button>`).join('')}</div>`;

function usageOptions(id,main){
 const key=records[id].feature;
 const specials={catalogue:[['Adjust stock','box'],['Record purchase','receipt'],['Add to shopping list','cart'],['Create task','task']],inventory:[['Count stock','layers'],['Scan barcode','barcode'],['Use one','box']],shopping:[['Start shopping trip','cart'],['Add item','plus'],['Choose shop group','store']],expenses:[['Mark paid','check'],['View payment QR','receipt'],['Add expense','plus']],money:[['Record transfer','swap'],['Record contribution','bank'],['Set real balance','edit']],recipes:[['Start cooking','recipe'],['Add to cooking plan','calendar']],tasks:[['Complete task','check'],['Add materials','cart'],['Set reminder','clock']],energy:[['Change period','calendar'],['Show gas','bolt']],devices:[['Open live status','device'],['Create maintenance task','task']]};
 return [[main,'check'],...(specials[key]||[['Open connected record','link'],['Create task','task']]).filter(x=>x[0]!==main)];
}
function manageOptions(id,main){
 const specials={catalogue:[['Link alternative','swap'],['Manage categories','layers'],['Archive product','notes']],expenses:[['Edit recurring series','repeat'],['Pause / resume','clock'],['End schedule','calendar']],money:[['Edit account','edit'],['Adjust contribution plan','bank']],tasks:[['Edit recurrence','repeat'],['Archive task','notes']],devices:[['Configure source','device'],['Archive device','notes']],projects:[['Edit budget','wallet'],['Archive project','notes']]};
 return [[main,'edit'],...(specials[records[id].feature]||[['Edit preferences','layers'],['View history','clock']]).filter(x=>x[0]!==main)];
}
function render(){
 // No lasting overlay after a navigation or screen redraw.
 document.querySelector('#overlays').innerHTML='';
 sidebar();topbar();demobar();document.querySelector('#screen').innerHTML=bodyView();bottomnav();
 document.querySelector('#mobileToggle')?.addEventListener('click',()=>{state.mobile=!state.mobile;document.body.classList.toggle('sim-phone',state.mobile);render()});
 document.querySelector('#navsearch')?.addEventListener('input',e=>{
   whState.search=e.target.value;
   const query=e.target.value.trim().toLowerCase();
   if(!query){sidebar();return;}
   const filtered=WH_IDS.filter(id=>[id,records[id].title,records[id].label,whFeature(id).name].join(' ').toLowerCase().includes(query)).slice(0,40);
   document.querySelector('#navresult').innerHTML=filtered.length?filtered.map(id=>`<button class="navlink" ${goto(id)}>${ico(records[id].icon)}${esc(records[id].title)}</button>`).join(''):'<div class="wh-muted">No matching screens</div>';
 });
}
function openModal(action){
 state.menu=null;state.modal=action;
 const isBrowser=action==='Browse wireframes';
 const list=isBrowser?Object.values(WH_FEATURES).map(f=>`<section class="wh-feature-group"><h3>${toneIcon(f.icon,f.tone)} ${esc(f.name)} <small>${f.screens.length} screens</small></h3><div class="wh-feature-chip-list">${f.screens.map(id=>`<button class="smallbtn" ${goto(id)}>${esc(records[id]?.label||id)}</button>`).join('')}</div></section>`).join(''):null;
 let content=isBrowser?`<div class="wh-browser-intro"><b>29 feature owners · ${WH_IDS.length} interactive wireframes</b><p>Navigate from feature overview to individual records and connected models. All data is illustrative.</p></div><div class="wh-feature-browser">${list}</div>`:
 action==='View product image'?`${milkPhoto()}<p class="wh-muted">Illustrative packshot. No real product data is accessed.</p>`:
 `<p>Try the <strong>${esc(action)}</strong> interface here. This is a design-only demonstration; it does not change your real WickedHome data.</p><div class="wh-modal-fields"><label>Value / amount / quantity<input aria-label="Example value" placeholder="Enter a value" value="${/stock|count/i.test(action)?'3 bottles':''}"></label><label>Notes (optional)<input aria-label="Example notes" placeholder="Household note"></label></div>`;
 document.querySelector('#overlays').innerHTML=`<div class="modal-layer" data-wh-backdrop="1"><div class="modal wh-modal" role="dialog" aria-modal="true" aria-label="${esc(action)}"><h2>${toneIcon(isBrowser?'grid':'info',isBrowser?'teal':'blue')}${esc(isBrowser?'Explore WickedHome':action)}</h2>${content}<footer><button data-close="1">Close</button>${isBrowser?'':`<button class="confirm" data-demo-save="1">Try action</button>`}</footer></div></div>`;
}

// Small local interactions. These are not persistence or a substitute for real owner services.
document.addEventListener('click',event=>{
 const t=event.target.closest('button,input');if(!t)return;
 if(t.matches('[data-wh-set]')){whState[t.dataset.whSet]=t.dataset.whValue;render();return;}
 if(t.matches('[data-wh-floor]')){whState.floor=t.dataset.whFloor;render();return;}
 if(t.matches('[data-wh-month]')){whState.monthOffset+=Number(t.dataset.whMonth);render();return;}
 if(t.matches('[data-wh-step]')){whState.step=Math.max(1,Math.min(5,whState.step+(t.dataset.whStep==='next'?1:-1)));render();return;}
 if(t.matches('[data-wh-ask]')){whState.search=document.getElementById('whAsk')?.value||'';render();return;}
});
document.addEventListener('change',event=>{const t=event.target;if(t.matches('[data-wh-check]')){whState.checked[t.dataset.whCheck]=t.checked;}});

(function init(){const url=new URL(location.href);state.screen=records[url.searchParams.get('screen')]?url.searchParams.get('screen'):'product';state.tab=url.searchParams.get('tab')==='overview'?'overview':'details';render()})();
</script>
