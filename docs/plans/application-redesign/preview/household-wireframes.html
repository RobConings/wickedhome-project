function manageOptions(id,main){return id==='product'?[['Edit product','edit'],['Link alternative','swap'],['Stock settings','layers'],['Archive product','notes']]:[[main,'edit'],['Link related record','link'],['Archive record','notes']]}
function stats(id){const s=id==='product'?[['3 bottles','In stock','box','green','stock'],['1','Shopping','cart','orange','shopping'],['4','Recipes','recipe','purple','recipe'],['12','Purchases','receipt','blue','purchases']]:id==='money'?[['€2,398','Actual balance','bank','green','account'],['€2,298','Forecast','trend','blue','account'],['14','Recurring','repeat','purple','recurring'],['4','Expenses','wallet','orange','expenses']]:id==='expenses'?[['4','Upcoming','calendar','orange','expense'],['14','Recurring','repeat','purple','recurring'],['21','Paid','check','green','expense'],['2','Accounts','bank','blue','account']]:[[records[id].values[0][1],records[id].values[0][0],records[id].icon,records[id].tone,id],['1','Shopping','cart','orange','shopping'],['3','Tasks','task','purple','task'],['2','Links','link','blue','product']];return `<div class="stats">${s.map(([v,l,ic,t,to])=>`<button class="stat" ${goto(to)}>${toneIcon(ic,t)}<span><strong>${esc(v)}</strong><small>${esc(l)}</small></span></button>`).join('')}</div>`}
function milkPhoto(){return `<div class="product-visual"><div class="milkcarton" aria-label="Illustrative Boni milk package"><div class="brand">b</div><div class="bonilabel">Boni</div><div class="milkname">Halfvolle<br>Melk</div><div class="milknl">Lait demi-écrémé</div><div class="meadow"><span>1 L</span></div></div><button class="visual-heart" aria-label="Favourite product" id="fav">${ico('heart')}</button><button class="visual-expand" data-action="View product image" aria-label="Enlarge product image">${ico('grid')}</button></div>`}
function productHero(){const id='product';return `<section class="hero">${milkPhoto()}<div class="hero-content"><div class="hero-top"><div><h1>Boni Halfvolle Melk 1L</h1><div class="chips"><span class="chip green">${ico('check')}In stock</span><span class="chip orange">${ico('star')}Essential</span><span class="chip" ${goto('shop')}>${ico('cart')}Colruyt</span><span class="chip">Dairy</span></div><p class="summary-description">${esc(records.product.subtitle)}</p></div><div class="desktop-actions">${actions(id)}</div></div>${stats(id)}<div class="mobile-actions">${actions(id)}</div></div></section>`}
function titleHead(id){let r=records[id];return `<div class="page-head"><div class="focus-title">${toneIcon(r.icon,r.tone)}<div><div class="kicker">${esc(r.label)}</div><h1>${esc(r.title)}</h1><p>${esc(r.subtitle)}</p></div></div>${actions(id)}</div>${stats(id)}`}
const navtabs=()=>`<div class="tabbar" role="tablist" aria-label="Record sections"><button role="tab" aria-selected="${state.tab==='details'}" class="${state.tab==='details'?'active':''}" data-active-tab="details">${ico('info')}Details</button><button role="tab" aria-selected="${state.tab==='overview'}" class="${state.tab==='overview'?'active':''}" data-active-tab="overview">${ico('layers')}Overview</button></div>`;
function quickInfo(id){const r=records[id];const rows=id==='product'?[['Barcode','5410141234567','barcode','blue'],['Pack size','1 liter (1 L)','box','teal'],['Brand','Boni','tag','purple'],['Shop','Colruyt','store','orange']]:r.values.slice(0,4).map(([a,b],i)=>[a,b,['info','box','tag','store'][i],['blue','green','purple','orange'][i]]);return `<section class="panel"><div class="panel-heading"><div class="panel-title">${toneIcon('info','blue')}Product info</div></div><div class="quick-row">${rows.map(([a,b,ic,t])=>`<div class="quick-item">${toneIcon(ic,t)}<span><small>${esc(a)}</small><strong>${esc(b)}</strong></span></div>`).join('')}</div></section>`}
function detailView(id){const r=records[id];let rows=id==='product'?r.values.slice(4):r.values;return `${quickInfo(id)}<section class="panel"><div class="panel-heading"><div class="panel-title">${toneIcon('list','purple')}${id==='product'?'Product details':`${esc(r.label)} details`}</div><button class="subtle-button" data-action="${esc(r.actions?.[1]||'Edit')}">${ico('edit')} Edit</button></div><table class="detail-table">${rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}${(k==='Product'||k==='Related purchase')?` <button class="smallbtn" ${goto(k==='Product'?'product':'purchase')}>Open</button>`:''}</td></tr>`).join('')}</table></section><section class="panel"><div class="panel-heading"><div class="panel-title">${toneIcon('notes','orange')}Notes</div></div><div class="notes">${esc(r.note)}</div></section>`}
function linkRows(id){if(id==='product')return {recipe:[['Pancakes','Uses 250 ml · Breakfast','🥞','recipe'],['Crepes','Family favourite','🧁','recipe'],['Milkshake','Uses milk','🥛','recipe']],shopping:[['On the shopping list','2 bottles · Colruyt','🛒','shopping']],purchases:[['Last purchase · 16 Oct 2026','4 bottles · €3.96','🧾','purchase']],alternatives:[['Boni Volle Melk 1L','Whole milk','🥛','alternatives'],['Lactose-free milk 1L','Alternative','🥤','alternatives']]};if(id==='expenses')return {recurring:[['Home internet','€49.99 monthly · Next 19 Nov','🔁','recurring']],expense:[['Colruyt','Paid · €3.96 · 16 Oct','🧾','expense']]};if(id==='money')return {account:[['Joint current account','Actual €2,398 · Forecast €2,298','🏦','account']],recurring:[['Home internet','Next €49.99 · 19 Nov','🔁','recurring']]};return {}}
function row(h,sub,symbol,to){return `<button class="record-row" ${goto(to)}><span class="record-emoji">${symbol||'🔗'}</span><span class="record-text"><strong>${esc(h)}</strong><small>${esc(sub)}</small></span>${ico('chev',17)}</button>`}
function overviewView(id){const r=records[id],lr=linkRows(id);return `<p class="overview-lede">Related records are real destinations. Open a card to explore that model, then use Back to return here.</p><div class="two-cols">${r.related.map(([to,l,n,ic,t])=>{let items=lr[to]||[[records[to]?.title||l,records[to]?.subtitle?.slice(0,70)||n,undefined,to]];return `<section class="link-card"><header><h3>${toneIcon(ic,t)}${esc(l)} <span class="muted" style="font-size:12px;font-weight:600">${esc(n)}</span></h3><a href="?screen=${to}&tab=details" ${goto(to)}>View all →</a></header>${items.slice(0,3).map(x=>row(...x)).join('')}</section>`}).join('')}</div>`}
function extraView(id){if(id==='home')return `<section class="panel"><div class="panel-heading"><div class="panel-title">${toneIcon('house','green')}Ground floor · room explorer</div><button class="subtle-button" data-action="Switch floor">${ico('layers')} Switch floor</button></div><div class="mini-map"><button class="room" ${goto('device')}>Living room<br>🌡 21.2 °C</button><button class="room" ${goto('task')}>Kitchen<br>🔧 1 task</button><button class="room" ${goto('energy')}>Utility<br>⚡ Meter</button><button class="room" ${goto('device')}>Hall<br>🚪</button><button class="room" ${goto('project')}>Bathroom<br>🛁</button></div></section>`;if(id==='money')return `<div class="split-feature"><section class="panel"><h2>Joint account activity</h2><div class="money-row"><div><strong>Recorded contributions</strong><small>Two household members</small></div><strong class="ledger-positive">+€2,800</strong></div><div class="money-row"><div><strong>Groceries</strong><small>Colruyt · paid</small></div><strong class="ledger-negative">−€3.96</strong></div><div class="money-row"><div><strong>Home internet</strong><small>Future recurring direct debit</small></div><strong class="muted">−€49.99 expected</strong></div><button class="subtle-button" ${goto('account')}>Open account ${ico('chev')}</button></section><section class="panel"><h2>Keep existing money flows</h2>${row('Income','Fixed and variable','💰','income')}${row('Recurring expenses','Manage due dates','🔁','recurring')}${row('Accounts','Transactions and corrections','🏦','account')}</section></div>`;if(id==='energy')return `<section class="panel"><h2>Electricity & gas</h2><div class="energy-flow"><div class="energy-node">${ico('sun')}Solar<br>6.8 kWh</div><span class="energy-arrow">→</span><div class="energy-node">${ico('house')}Home<br>15.2 kWh</div><span class="energy-arrow">←</span><div class="energy-node">${ico('bolt')}Grid<br>12.3 kWh</div></div><p class="fineprint">Sample values only. Battery / gas and nested metering remain separate source-aware flows; no invented readings.</p></section>`;if(id==='shopping')return `<section class="panel"><div class="panel-heading"><div class="panel-title">${toneIcon('cart','orange')}Today's list</div><button class="subtle-button" data-action="Start shopping">Start trip</button></div>${[['Boni Halfvolle Melk','2 bottles · Colruyt','product'],['Eggs','6 pieces · Colruyt','recipe'],['Bread','1 loaf · Colruyt','shop'],['Pasta','500 g · Colruyt','recipe']].map(([t,s,to])=>`<div class="record-row"><input type="checkbox" class="check-item" aria-label="Mark ${esc(t)} bought" style="width:18px;height:18px;accent-color:#0b8048"/><span class="record-text"><strong>${t}</strong><small>${s}</small></span><button class="smallbtn" ${goto(to)}>Open</button></div>`).join('')}</section>`;if(id==='recurring')return `<section class="panel"><h2>Upcoming occurrences</h2>${[['19 Nov 2026','€49.99 · Expected'],['19 Dec 2026','€49.99 · Expected'],['19 Jan 2027','€49.99 · Expected']].map(([d,v])=>`<div class="money-row"><span><strong>${d}</strong><small>${v}</small></span><button class="subtle-button" data-action="Edit occurrence">Edit this payment</button></div>`).join('')}<p class="fineprint">Editing an occurrence does not change all future payments. Pause/resume preserves paid history.</p></section>`;if(id==='account')return `<section class="panel"><h2>Linked account entries</h2>${row('Household contribution','+€1,500 · Recorded','💰','income')}${row('Colruyt expense','−€3.96 · Paid','🧾','expense')}${row('Monthly internet','€49.99 expected · Not yet paid','🔁','recurring')}</section>`;return ''}
function bodyView(){const id=state.screen;return `${id==='product'?productHero():titleHead(id)}${navtabs()}${state.tab==='details'?detailView(id):`${extraView(id)}${overviewView(id)}`}`}
function bottomnav(){const links=[['dashboard','Today','home'],['task','Tasks','task'],['shopping','Shopping','cart'],['home','Home','house'],['product','More','grid']];document.querySelector('#bottomnav').innerHTML=links.map(([id,label,icon])=>`<button ${goto(id)} class="${state.screen===id?'active':''}">${ico(icon)}${label}</button>`).join('')}
function render(){sidebar();topbar();demobar();document.querySelector('#screen').innerHTML=bodyView();bottomnav();document.querySelector('#mobileToggle')?.addEventListener('click',()=>{state.mobile=!state.mobile;document.body.classList.toggle('sim-phone',state.mobile);render()});document.querySelector('#navsearch')?.addEventListener('input',e=>{const query=e.target.value.trim().toLowerCase();const matches=Object.entries(records).filter(([id,v])=>id.includes(query)||v.title.toLowerCase().includes(query)||v.label.toLowerCase().includes(query)).slice(0,16);document.querySelector('#navresult').innerHTML=query?matches.map(([id,v])=>`<button class="navlink" ${goto(id)}>${ico(v.icon)}${esc(v.title)}</button>`).join('')||'<small>No matching wireframes</small>':(sidebar(),null)});}
function closeMenu(){state.menu=null;render()}
function openModal(action){state.menu=null;state.modal=action;const list=action==='Browse wireframes';const contents=list?`<p>Select any workspace and follow its relationships.</p><div class="screen-tiles">${Object.entries(records).map(([id,r])=>`<button class="screen-tile" ${goto(id)}>${toneIcon(r.icon,r.tone)}${esc(r.label)}</button>`).join('')}</div>`:action==='View product image'?`<div class="product-visual" style="max-height:350px">${milkPhoto()}</div><p class="fineprint">Illustrative product packshot for this design prototype.</p>`:`<p>This opens the <strong>${esc(action)}</strong> workflow in the real app. In this prototype, the layout and navigation are interactive but <strong>no data is saved</strong>.</p><div class="fields"><label>Example quantity or value<input value="${action.toLowerCase().includes('stock')?'3 bottles':action.toLowerCase().includes('shopping')?'2 bottles':''}" aria-label="Example value"/></label><label>Notes (optional)<input placeholder="Add a household note"/></label></div>`;document.querySelector('#overlays').innerHTML=`<div class="modal-layer"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(action)}"><h2>${toneIcon(list?'grid':'info',list?'green':'blue')}${esc(action)}</h2>${contents}<footer><button data-close="1">Close</button>${list?'':`<button class="confirm" data-demo-save="1">Try action</button>`}</footer></div></div>`}
let toastTimer;function toast(msg){clearTimeout(toastTimer);document.querySelector('#overlays').innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;toastTimer=setTimeout(()=>document.querySelector('#overlays').innerHTML='',2600)}
document.addEventListener('click',e=>{let target=e.target.closest('button,a');if(!target){if(state.menu){state.menu=null;render()}return}if(target.matches('[data-go]')){e.preventDefault();navto(target.dataset.go,target.dataset.tab||'details');return}if(target.matches('[data-active-tab]')){state.tab=target.dataset.activeTab;const u=new URL(location.href);u.searchParams.set('tab',state.tab);history.replaceState({id:state.screen,tab:state.tab},'',u);render();return}if(target.matches('[data-menu]')){state.menu=state.menu===target.dataset.menu?null:target.dataset.menu;render();return}if(target.matches('[data-action]')){openModal(target.dataset.action);return}if(target.matches('[data-close]')){document.querySelector('#overlays').innerHTML='';return}if(target.matches('[data-demo-save]')){toast('Demo interaction only — no household data changed.');return}if(target.id==='backBtn'){history.back();return}if(target.id==='fav'){state.fav=!state.fav;target.style.color=state.fav?'#c32653':'#2f4858';toast(state.fav?'Added to favourites (demo)':'Removed from favourites (demo)');return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelector('#overlays').innerHTML='';if(state.menu){state.menu=null;render()}}});
window.addEventListener('popstate',()=>{const u=new URL(location.href);state.screen=records[u.searchParams.get('screen')]?u.searchParams.get('screen'):'product';state.tab=u.searchParams.get('tab')==='overview'?'overview':'details';state.menu=null;render()});
(function init(){const url=new URL(location.href);state.screen=records[url.searchParams.get('screen')]?url.searchParams.get('screen'):'product';state.tab=url.searchParams.get('tab')==='overview'?'overview':'details';render()})();
</script>
</body>
</html>
